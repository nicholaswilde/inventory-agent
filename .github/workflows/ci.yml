name: CI

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Taskfile.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Taskfile.yml"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest -v --cov=scripts --cov-report=term --cov-report=xml:coverage.xml tests/

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          fail-on-error: false
