version: '3'

dotenv: ['.env']

tasks:
  init:
    desc: Copy .env.example to .env
    cmds:
      - cp .env.example .env

  encrypt:
    desc: Encrypt .env to .env.enc using SOPS
    cmds:
      - sops --encrypt --input-type dotenv --output-type dotenv --output .env.enc .env

  decrypt:
    desc: Decrypt .env.enc to .env using SOPS
    cmds:
      - sops --decrypt --input-type dotenv --output-type dotenv --output .env .env.enc

  homebox:list:
    desc: List all Homebox entities
    cmds:
      - hbctl item list --all

  homebox:get:
    desc: Get Homebox entity by ID
    cmds:
      - hbctl item get {{.ID}} --json
    requires:
      vars: [ID]

  homebox:update:
    desc: Update Homebox entity by ID with JSON payload (set FILL_MISSING=1 to preserve existing values)
    cmds:
      - printf '%s' '{{.DATA}}' | hbctl item update {{.ID}} --from-json - {{if eq .FILL_MISSING "1"}}--fill-missing{{end}}
    requires:
      vars: [ID, DATA]

  homebox:create:
    desc: Create Homebox entity with JSON payload (optional ATTACH='<path>')
    cmds:
      - printf '%s' '{{.DATA}}' | hbctl item create --from-json - {{if .ATTACH}}--attach '{{.ATTACH}}' --optimize{{end}} --json
    requires:
      vars: [DATA]

  homebox:delete:
    desc: Delete Homebox entity by ID
    cmds:
      - hbctl item delete {{.ID}} --force
    requires:
      vars: [ID]

  homebox:attach:
    desc: Attach a file to a Homebox entity
    cmds:
      - hbctl attachment upload --optimize {{.ID}} '{{.FILE}}'
    requires:
      vars: [ID, FILE]

  homebox:entity-types:
    desc: List all Homebox entity types
    cmds:
      - hbctl entity-types

  homebox:status:
    desc: Check remote Homebox server connectivity and version
    cmds:
      - hbctl status {{.CLI_ARGS}}

  homebox:tree:
    desc: Render Homebox item parent/location hierarchy as a tree
    cmds:
      - hbctl item tree {{.CLI_ARGS}}

  homebox:move:
    desc: Move Homebox item under a parent item/location (or 'none' to unparent)
    cmds:
      - hbctl item move {{.ID}} '{{.PARENT}}'
    requires:
      vars: [ID, PARENT]

  process-vision:
    desc: Process electronic component images using vision pipeline
    aliases:
      - process-images
    cmds:
      - uv run scripts/process_vision.py {{.CLI_ARGS}}

  homebox:search:
    desc: Search Homebox entities by name
    cmds:
      - hbctl search '{{.QUERY}}'
    requires:
      vars: [QUERY]

  homebox:dedup:
    desc: Detect duplicate HomeBox entities and report them
    cmds:
      - hbctl item dedup --threshold {{.THRESHOLD | default "0.8"}} {{.CLI_ARGS}}

  homebox:dedup-delete:
    desc: Delete duplicate HomeBox entities (keeps most descriptive). Use DRY_RUN=1 to preview.
    cmds:
      - hbctl item dedup --threshold {{.THRESHOLD | default "0.8"}} --delete {{if eq .DRY_RUN "1"}}--dry-run{{end}}

  homebox:dedup-merge:
    desc: Merge quantities then delete duplicates. Use DRY_RUN=1 to preview.
    cmds:
      - hbctl item dedup --threshold {{.THRESHOLD | default "0.8"}} --merge {{if eq .DRY_RUN "1"}}--dry-run{{end}}

  issue:extract:
    desc: Extract an issue and run OCR quietly
    cmds:
      - ./scripts/extract_issue.sh {{.ISSUE}}
    requires:
      vars: [ISSUE]

  manuals:pull:
    desc: Pull appliance PDF manuals from Homebox to local directory
    cmds:
      - uv run scripts/pull_appliance_manuals.py {{.CLI_ARGS}}

  manual:ingest:
    desc: Ingest an appliance manual (PDF path, URL, or GitHub issue #) into Homebox and generate quick lookup doc
    cmds:
      - uv run scripts/ingest_manual.py '{{.FILE | default .ISSUE}}' {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{.CLI_ARGS}}
    preconditions:
      - sh: 'test -n "{{.FILE}}{{.ISSUE}}"'
        msg: "Either FILE or ISSUE must be specified (e.g. task manual:ingest FILE=... or task manual:ingest ISSUE=...)"

  manual:ingest-issue:
    desc: Ingest an appliance PDF manual from a GitHub issue into Homebox
    cmds:
      - uv run scripts/ingest_manual.py --issue {{.ISSUE}} {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{.CLI_ARGS}}
    requires:
      vars: [ISSUE]

  url:import:
    desc: Import an item into Homebox from a product URL or Amazon item number/ASIN
    cmds:
      - uv run scripts/import_url.py '{{.URL}}' {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{.CLI_ARGS}}
    requires:
      vars: [URL]

  batch:import:
    desc: Batch import items into Homebox from URLs, ASINs, text file, or Amazon CSV
    cmds:
      - uv run scripts/batch_import.py {{if .ITEMS}}{{.ITEMS}}{{end}} {{if .FILE}}--file '{{.FILE}}'{{end}} {{if .CSV}}--csv '{{.CSV}}'{{end}} {{if .CATEGORY}}--category '{{.CATEGORY}}'{{end}} {{if .MIN_PRICE}}--min-price {{.MIN_PRICE}}{{end}} {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{if eq .NO_ATTACH "1"}}--no-attach{{end}} {{if eq .UPDATE "1"}}--update-existing{{end}} {{.CLI_ARGS}}


  invoice:import:
    desc: Import an Amazon PDF invoice into Homebox, filling missing item details or creating new items
    cmds:
      - uv run scripts/import_amazon_invoice.py '{{.FILE}}' {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{if eq .NO_ATTACH "1"}}--no-attach{{end}} {{.CLI_ARGS}}
    requires:
      vars: [FILE]

  parts:download:
    desc: Download GE appliance parts assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_ge_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:bosch:
    desc: Download Bosch appliance spare parts assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_bosch_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:lg:
    desc: Download LG appliance spare parts assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_lg_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:repairclinic:
    desc: Download RepairClinic appliance assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_repairclinic_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:appliancepartspros:
    desc: Download AppliancePartsPros appliance assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_appliancepartspros_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  diagrams:upload:
    desc: Upload appliance assembly diagrams to Homebox entities
    cmds:
      - uv run scripts/upload_appliance_diagrams.py {{.CLI_ARGS}}

  appliance:list:
    desc: List all cataloged appliances and BOM status
    cmds:
      - uv run scripts/query_appliance.py list {{.CLI_ARGS}}

  appliance:info:
    desc: Get detailed specifications, error codes, and BOM for an appliance
    cmds:
      - uv run scripts/query_appliance.py info '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  appliance:search:
    desc: Unified search across appliances, specs, error codes, and BOM parts
    cmds:
      - uv run scripts/query_appliance.py search '{{.QUERY}}' {{.CLI_ARGS}}
    requires:
      vars: [QUERY]

  appliance:part:
    desc: Search appliance replacement parts by number, callout, or description
    cmds:
      - uv run scripts/query_appliance.py part '{{.QUERY}}' {{.CLI_ARGS}}
    requires:
      vars: [QUERY]

  appliance:error:
    desc: Search appliance error codes and troubleshooting actions
    cmds:
      - uv run scripts/query_appliance.py error '{{.QUERY}}' {{.CLI_ARGS}}
    requires:
      vars: [QUERY]

  maintenance:list:
    desc: List Homebox appliance maintenance entries (optional TARGET='<slug|model|id>', STATUS=both|completed|scheduled)
    cmds:
      - uv run scripts/appliance_maintenance.py list{{if .TARGET}} {{.TARGET | shellQuote}}{{end}}{{if .STATUS}} --status {{.STATUS | shellQuote}}{{end}} {{.CLI_ARGS}}

  maintenance:log:
    desc: Log appliance maintenance to Homebox and local cheat sheet (TARGET, NAME; optional DATE, DISPLAY_DATE, SCHEDULED, PART, COST, NOTES, DRY_RUN=1)
    cmds:
      - uv run scripts/appliance_maintenance.py log {{.TARGET | shellQuote}} --name {{.NAME | shellQuote}}{{if .DATE}} --date {{.DATE | shellQuote}}{{end}}{{if .DISPLAY_DATE}} --display-date {{.DISPLAY_DATE | shellQuote}}{{end}}{{if .SCHEDULED}} --scheduled {{.SCHEDULED | shellQuote}}{{end}}{{if .PART}} --part {{.PART | shellQuote}}{{end}}{{if .COST}} --cost {{.COST | shellQuote}}{{end}}{{if .NOTES}} --notes {{.NOTES | shellQuote}}{{end}}{{if eq .DRY_RUN "1"}} --dry-run{{end}} {{.CLI_ARGS}}
    requires:
      vars: [TARGET, NAME]

  maintenance:delete:
    desc: Delete a Homebox maintenance entry by ID (optional DRY_RUN=1)
    cmds:
      - uv run scripts/appliance_maintenance.py delete {{.ID | shellQuote}}{{if eq .DRY_RUN "1"}} --dry-run{{end}} {{.CLI_ARGS}}
    requires:
      vars: [ID]

  tare:upsert:
    desc: Upsert kitchen container tare weight into Homebox
    cmds:
      - hbctl item upsert --name {{.NAME | shellQuote}} --tag kitchen --tag container --tag tare-weight --field {{printf "Tare Weight (g)=%s" .WEIGHT | shellQuote}} --field-type number {{.CLI_ARGS}}
    requires:
      vars: [NAME, WEIGHT]

  tare:sheet:
    desc: Generate printable tare weight reference sheet Markdown table
    aliases:
      - tare:show
      - tare:table
    cmds:
      - hbctl export --tag tare-weight --format markdown --columns "name=Container / Item,Tare Weight (g)" --align left --empty "-" --sort name {{.CLI_ARGS}}

  tare:pdf:
    desc: 'Generate tare weight reference sheet as a PDF in output/ (options: FONT_SIZE=6pt, PAPER=card)'
    vars:
      FONT_SIZE: '{{.FONT_SIZE | default "6pt"}}'
      MARGIN: '{{.MARGIN | default "0.5in"}}'
      GEOMETRY: '{{if eq .PAPER "card"}}paperwidth=4in,paperheight=6in,margin=0.25in{{else}}margin={{.MARGIN}}{{end}}'
      OUTPUT: '{{if .OUTPUT}}{{.OUTPUT}}{{else if eq .PAPER "card"}}output/tare_weights_card.pdf{{else}}output/tare_weights.pdf{{end}}'
    cmds:
      - mkdir -p output
      - 'hbctl export --tag tare-weight --format markdown --columns "name=Container / Item,Tare Weight (g)" --align left --empty "-" --sort name | pandoc -o "{{.OUTPUT}}" --pdf-engine=xelatex -V mainfont="DejaVu Sans" -V "geometry:{{.GEOMETRY}}" -V "header-includes=\usepackage{scrextend}\changefontsizes{ {{.FONT_SIZE}} }\setlength{\LTleft}{0pt}\setlength{\LTright}{\fill}" {{.CLI_ARGS}}'
      - 'echo "PDF generated at {{.OUTPUT}}"'

  tare:serve:
    desc: Generate tare weight PDF and serve on LAN for browser viewing
    deps: [tare:pdf]
    cmds:
      - echo "View/download PDF at http://$(hostname -I | awk '{print $1}'):{{.PORT | default "8080"}}/tare_weights.pdf"
      - python3 -m http.server {{.PORT | default "8080"}} --directory output

  print:brother:
    desc: Convert markdown text to PDF and print to BrotherPrinter
    aliases:
      - print:local
    cmds:
      - ./scripts/print_to_brother.sh '{{.TEXT}}'
    requires:
      vars: [TEXT]

  test:
    desc: Run all tests (API, bash scripts, vision pipeline)
    cmds:
      - uv run pytest -v {{.CLI_ARGS | default "tests/"}}

  test:coverage:
    desc: Run all tests with code coverage (terminal and coverage.xml reports)
    cmds:
      - uv run pytest -v --cov=scripts --cov-report=term --cov-report=xml:coverage.xml {{.CLI_ARGS | default "tests/"}}

  coveralls:
    desc: Report test coverage to Coveralls.io using coveralls binary
    cmds:
      - coveralls report {{.CLI_ARGS}}

  default:
    cmds:
      - task -l
    silent: true
