version: '3'

dotenv: ['.env']

tasks:
  init:
    desc: Copy .env.example to .env
    cmds:
      - cp .env.example .env

  encrypt:
    desc: Encrypt .env to .env.enc using SOPS
    cmds:
      - sops --encrypt --input-type dotenv --output-type dotenv --output .env.enc .env

  decrypt:
    desc: Decrypt .env.enc to .env using SOPS
    cmds:
      - sops --decrypt --input-type dotenv --output-type dotenv --output .env .env.enc

  homebox:list:
    desc: List all Homebox entities
    cmds:
      - ./scripts/homebox.sh list

  homebox:get:
    desc: Get Homebox entity by ID
    cmds:
      - ./scripts/homebox.sh get {{.ID}}
    requires:
      vars: [ID]

  homebox:update:
    desc: Update Homebox entity by ID with JSON payload
    cmds:
      - ./scripts/homebox.sh update {{.ID}} '{{.DATA}}'
    requires:
      vars: [ID, DATA]

  homebox:create:
    desc: Create Homebox entity with JSON payload
    cmds:
      - ./scripts/homebox.sh create '{{.DATA}}'
    requires:
      vars: [DATA]

  homebox:delete:
    desc: Delete Homebox entity by ID
    cmds:
      - ./scripts/homebox.sh delete {{.ID}}
    requires:
      vars: [ID]

  homebox:attach:
    desc: Attach a file to a Homebox entity
    cmds:
      - ./scripts/homebox.sh attach {{.ID}} '{{.FILE}}'
    requires:
      vars: [ID, FILE]

  homebox:entity-types:
    desc: List all Homebox entity types
    cmds:
      - ./scripts/homebox.sh entity-types

  process-vision:
    desc: Process electronic component images using vision pipeline
    aliases:
      - process-images
    cmds:
      - uv run scripts/process_vision.py {{.CLI_ARGS}}

  homebox:search:
    desc: Search Homebox entities by name
    cmds:
      - ./scripts/homebox.sh search '{{.QUERY}}'
    requires:
      vars: [QUERY]

  homebox:dedup:
    desc: Detect duplicate HomeBox entities and report them
    cmds:
      - uv run scripts/homebox_dedup.py --threshold {{.THRESHOLD | default "0.8"}} {{.CLI_ARGS}}

  homebox:dedup-delete:
    desc: Delete duplicate HomeBox entities (keeps most descriptive). Use DRY_RUN=1 to preview.
    cmds:
      - uv run scripts/homebox_dedup.py --threshold {{.THRESHOLD | default "0.8"}} --delete {{if eq .DRY_RUN "1"}}--dry-run{{end}}

  homebox:dedup-merge:
    desc: Merge quantities then delete duplicates. Use DRY_RUN=1 to preview.
    cmds:
      - uv run scripts/homebox_dedup.py --threshold {{.THRESHOLD | default "0.8"}} --merge {{if eq .DRY_RUN "1"}}--dry-run{{end}}

  issue:extract:
    desc: Extract an issue and run OCR quietly
    cmds:
      - ./scripts/extract_issue.sh {{.ISSUE}}
    requires:
      vars: [ISSUE]

  manual:ingest:
    desc: Ingest an appliance manual (PDF path or URL) into Homebox and generate quick lookup doc
    cmds:
      - uv run scripts/ingest_manual.py '{{.FILE}}' {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{.CLI_ARGS}}
    requires:
      vars: [FILE]

  url:import:
    desc: Import an item into Homebox from a product URL (Amazon, retail, product pages)
    cmds:
      - uv run scripts/import_url.py '{{.URL}}' {{if eq .DRY_RUN "1"}}--dry-run{{end}} {{.CLI_ARGS}}
    requires:
      vars: [URL]

  parts:download:
    desc: Download GE appliance parts assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_ge_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:bosch:
    desc: Download Bosch appliance spare parts assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_bosch_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:lg:
    desc: Download LG appliance spare parts assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_lg_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  parts:repairclinic:
    desc: Download RepairClinic appliance assembly diagrams and bill of materials
    cmds:
      - uv run scripts/download_repairclinic_parts.py '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  appliance:list:
    desc: List all cataloged appliances and BOM status
    cmds:
      - uv run scripts/query_appliance.py list {{.CLI_ARGS}}

  appliance:info:
    desc: Get detailed specifications, error codes, and BOM for an appliance
    cmds:
      - uv run scripts/query_appliance.py info '{{.TARGET}}' {{.CLI_ARGS}}
    requires:
      vars: [TARGET]

  appliance:search:
    desc: Unified search across appliances, specs, error codes, and BOM parts
    cmds:
      - uv run scripts/query_appliance.py search '{{.QUERY}}' {{.CLI_ARGS}}
    requires:
      vars: [QUERY]

  appliance:part:
    desc: Search appliance replacement parts by number, callout, or description
    cmds:
      - uv run scripts/query_appliance.py part '{{.QUERY}}' {{.CLI_ARGS}}
    requires:
      vars: [QUERY]

  appliance:error:
    desc: Search appliance error codes and troubleshooting actions
    cmds:
      - uv run scripts/query_appliance.py error '{{.QUERY}}' {{.CLI_ARGS}}
    requires:
      vars: [QUERY]

  test:
    desc: Run all tests (API, bash scripts, vision pipeline)
    cmds:
      - uv run pytest -v {{.CLI_ARGS | default "tests/"}}

  test:coverage:
    desc: Run all tests with code coverage (terminal and coverage.xml reports)
    cmds:
      - uv run pytest -v --cov=scripts --cov-report=term --cov-report=xml:coverage.xml {{.CLI_ARGS | default "tests/"}}

  coveralls:
    desc: Report test coverage to Coveralls.io using coveralls binary
    cmds:
      - coveralls report {{.CLI_ARGS}}

  default:
    cmds:
      - task -l
    silent: true
